[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deforum"
version = "0.2.0"
description = "State-of-the-art Animation Diffusion in PyTorch."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "The Deforum team", email = "deforum-art@deforum.com" }]
keywords = ["deep learning", "diffusion", "deforum", "pytorch", "stable diffusion", "flux"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch / torchvision are deliberately unpinned: install the build that matches your hardware
# first (see install.sh / README: CUDA, ROCm, Apple MPS or CPU), then `pip install -e .`.
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "torchsde>=0.2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "einops>=0.8",
    "numexpr>=2.10",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "Pillow>=10.1",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "kornia>=0.7.2",
    "timm>=1.0",
    "transformers>=4.50",
    "safetensors>=0.4.2",
    "omegaconf>=2.3",
    "av>=12",
    "imageio[ffmpeg]>=2.34",
    "tqdm",
    "rich>=13",
    "requests",
    "gdown>=5",
    "piexif>=1.1.3",
    "psutil>=5.9",
    "python-decouple>=3.8",
    "loguru>=0.7.2",
    "GitPython>=3.1.43",
    "contexttimer>=0.3.3",
    "mutagen>=1.47",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "librosa>=0.10.2",
    # UI
    "qtpy>=2.4.1",
    "PyQt6>=6.7",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "syrupy>=4.6", "pytest-cov>=5"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
webui = ["streamlit>=1.38"]
trt = [
    "tensorrt>=10.0; platform_system != 'Darwin'",
    "onnx>=1.16",
    "onnx_graphsurgeon>=0.5.2",
    "polygraphy>=0.49.9",
]

[project.urls]
Homepage = "https://github.com/deforum-studio/deforum"

[project.scripts]
deforum = "deforum.commands.deforum_cli:start_deforum_cli"
deforum-test = "deforum.commands.deforum_test:start_deforum_test"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deforum*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.qss", "*.png", "*.ico", "*.txt", "*.md", "*.html", "*.yaml", "*.ttf", "*.otf"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["E501"]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["deforum"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
